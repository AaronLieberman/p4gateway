name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 gives the build a full history: gw's version number
      # is the commit count behind HEAD, and a shallow clone can only report
      # it as unknown (see cmake/GitVersion.cmake).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    runs-on: windows-latest
    steps:
      # fetch-depth: 0 gives the build a full history: gw's version number
      # is the commit count behind HEAD, and a shallow clone can only report
      # it as unknown (see cmake/GitVersion.cmake).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
